input_bcf: raw/jews.bcf
metadata: metadata/samples.csv

populations:
  A: Ashkenazi Jews
  G: Georgian Jews
  M: Mountain Jews

# Folded SFS projections are selected from the autosomal easySFS preview.
# auto: smallest projection retaining the configured fraction of the maximum
# number of segregating sites; max: projection with the absolute maximum;
# manual: use the values below. Population order is A, G, M.
projection_selection:
  mode: auto
  min_fraction_of_max_sites: 0.99
  manual: [74, 24, 88]

qc:
  min_alleles: 2
  max_alleles: 2
  min_gq: 20
  min_dp: 8
  max_dp: 60
  max_missing: 0.05
  min_mac: 2
  ld_window_kb: 200
  ld_step: 1
  ld_r2: 0.2
  king_cutoff: 0.0884

gadma:
  # Screening of all four topologies.
  selection_repeats: 8
  # Additional independent starts for the selected topology only.
  refinement_repeats: 16
  processes: 4
  # Explicit genetic-unit bounds used identically for every topology.
  # If any best fit hits a bound, change it here and rerun `select` for ALL
  # models before interpreting AIC.
  bounds:
    population_size: [0.01, 100.0]
    time: [1.0e-15, 5.0]
    migration: [0.0, 10.0]
